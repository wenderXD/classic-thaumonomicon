modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "logo.png"
# Pixel art: shown sharp rather than smoothed.
logoBlur = false
authors = "${mod_authors}"
credits = "Thaumaturge by Leclowndu93150 and its contributors; the icon carries Thaumaturge's Thaumonomicon and TT mark. Frame, plates and nebula redrawn for Thaumaturge's Legacy. Original Thaumcraft by Azanor."
description = '''${mod_description}'''

# Purely a client-side reskin: servers never need it, and a client with it can join one without it.
displayTest = "IGNORE_ALL_VERSION"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "thaumaturge"
type = "required"
versionRange = "${thaumaturge_version_range}"
ordering = "AFTER"
side = "CLIENT"
